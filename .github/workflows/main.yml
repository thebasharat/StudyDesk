name: Build StudyDesk Windows EXE

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build-windows:
    # windows-2022 includes the WiX Toolset that jpackage needs for installers
    runs-on: windows-2022

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build fat jar with Maven
        run: mvn -B clean package

      - name: Check jar contains PDFBox
        shell: bash
        run: |
          ls -lh target/StudyDesk.jar
          jar tf target/StudyDesk.jar | grep -m1 "org/apache/pdfbox/Loader.class" \
            || (echo "PDFBox is NOT inside the jar!" && exit 1)

      - name: Prepare jpackage input folder
        shell: bash
        run: |
          mkdir dist
          cp target/StudyDesk.jar dist/

      # Portable app (folder containing StudyDesk.exe). No WiX needed.
      # --win-console opens a console window so errors are visible while debugging.
      # Remove that line once everything works.
      - name: Build portable app (app-image)
        shell: bash
        run: |
          jpackage \
            --type app-image \
            --name StudyDesk \
            --app-version 1.0 \
            --input dist \
            --main-jar StudyDesk.jar \
            --main-class com.studydesk.Main \
            --add-modules java.desktop,java.logging,java.xml,java.naming,jdk.charsets \
            --java-options "-Dfile.encoding=UTF-8" \
            --win-console \
            --dest out-portable

      # Installer: StudyDesk-1.0.exe
      - name: Build installer (exe)
        shell: bash
        run: |
          jpackage \
            --type exe \
            --name StudyDesk \
            --app-version 1.0 \
            --input dist \
            --main-jar StudyDesk.jar \
            --main-class com.studydesk.Main \
            --add-modules java.desktop,java.logging,java.xml,java.naming,jdk.charsets \
            --java-options "-Dfile.encoding=UTF-8" \
            --win-console \
            --win-menu \
            --win-shortcut \
            --win-dir-chooser \
            --dest out-installer

      - name: Upload portable app
        uses: actions/upload-artifact@v4
        with:
          name: StudyDesk-portable
          path: out-portable/StudyDesk

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: StudyDesk-installer
          path: out-installer/*.exe
